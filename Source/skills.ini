; ============================================================
;  MMHelper - 技能 ID 對照表
;
;  格式:
;    [職業名稱]
;    0x技能ID = 顯示名稱
;    [合併群組-職業名稱]
;    合併名稱 = 顯示名稱1, 顯示名稱2, 顯示名稱3
;
;  顯示名稱慣例（跨職業統一）:
;    普攻
;    N技 技能名
;    N技 技能名+
;    N技 技能名 [M段]
;    N技 技能名-子招式   （合併時取 '-' 前；例：大劍術-大地橫掃 → 大劍術）
;    N技改 / N技改K 技能名
;    被動N 技能名
;    修飾語一律用半形括號：技能名(修飾) 或 技能名(修飾A)(修飾B)
;    複合修飾可用中點：技能名(修飾A・修飾B)
;
;  - 檔案必須放在 MMHelper.exe 同一資料夾（執行目錄）
;  - 可在程式內用「未對照」按鈕為未知 ID 命名並立即生效
;  - 亦可手動編輯；按「開始」或程式內寫入後會重載
;  - Debug 重建可能覆寫輸出目錄副本（CopyToOutputDirectory）
;  - 「清除」會一併清空 log／數值／未對照 ID 清單
;  - 以 ; 或 # 開頭的行為註解
;  - 技能 ID 支援 "0x64d5b11d" 或 "64d5b11d" 兩種寫法,大小寫皆可
;  - 找不到對應 ID 的技能會顯示原始 hex ID
;  - UI 顯示時會自動加上 section 前綴，例如 [魔法師] 1技 雷電（檔案內仍存裸名）
;  - 職業區技能排序：普攻 → 被動N（N 小到大）→ 1–6技（N 小到大）；同組內依名稱再依 ID
;  - 全量表可用 tools/pack-re/rebuild_skills_ini_zh.py / sort_skills_ini.py 重產或重排
; ============================================================

