name: Build macOS app

# 只在打 tag 發版時執行,平時 push 不會跑。
# 公開 repo 使用 standard runner 免費且不限額度。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    # 《瑪奇 Mobile》在 macOS 上是 iOS App on Mac,只能在 Apple Silicon 執行,
    # 所以不需要 Intel/ARM 雙架構 matrix。
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 提早失敗:tkinter 缺了的話,等打包完才發現會浪費整輪 build
      - name: 確認 tkinter 可用
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      # Brotli 是角色身分偵測的硬相依 — 少了它解不開 0x4FFF / 0x4E4F,
      # 綁不到自己的實體 ID,傷害統計會整個空白 (見 PacketNotes_Identity §9)。
      - name: 安裝相依套件
        run: python -m pip install scapy==2.7.0 customtkinter==5.2.2 Brotli==1.1.0 pyinstaller==6.21.0

      - name: 建置 .app
        working-directory: Source
        run: ./MabinogiMobileScribe_BuildTool.sh

      # 用 ditto 而非 zip:.app 是目錄結構,ditto 才會保留 symlink 與
      # 簽章所需的 metadata,否則解壓後的 app 會打不開。
      # 原始碼檔名不再帶版號(見 RELEASING.md),所以版號改讀 VERSION_STR。
      # zip 名稱格式維持不變:MMScribe.Beta.V0.52.macOS.zip
      - name: 壓縮 Release 版
        working-directory: Source/dist
        run: |
          VER="$(sed -n 's/^VERSION_STR[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
                   ../MabinogiMobileScribe_Beta.py | head -1)"
          if [ -z "$VER" ]; then
            echo "::error::讀不到 VERSION_STR,無法決定發布檔名"
            exit 1
          fi

          # 打 tag 發版時順手核對。VERSION_STR 忘了跟 tag 一起更新的話,
          # 會做出一個版號對不上 release 的 zip — 不值得中斷建置,但要講出來。
          case "${GITHUB_REF:-}" in
            refs/tags/*)
              tag_num="${GITHUB_REF_NAME#v}"; tag_num="${tag_num%%-*}"
              ver_num="${VER##*[Vv]}"
              if [ "$tag_num" != "$ver_num" ]; then
                echo "::warning::tag 是 ${GITHUB_REF_NAME},但 VERSION_STR 是「${VER}」— 版號不一致"
              fi
              ;;
          esac

          NAME="MMScribe.${VER// /.}.macOS.zip"
          ditto -c -k --keepParent "MM Scribe.app" "$NAME"
          echo "ZIP_NAME=$NAME" >> "$GITHUB_ENV"
          ls -la "$NAME"

      - name: 上傳為 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: Source/dist/${{ env.ZIP_NAME }}

      # 有 tag 才附到 release;手動觸發時只留 artifact。
      #
      # release 可能還沒建立(先 git push --tags、稍後才寫 release 說明是常見流程),
      # 這種情況只提示不失敗 — 產物仍然保留在上面的 artifact,可以事後補上,
      # 沒必要為此寄一封 workflow 失敗通知。
      - name: 附加到 release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: Source/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP_NAME" --clobber
            echo "已附加到 release $GITHUB_REF_NAME"
          else
            echo "::notice::release $GITHUB_REF_NAME 尚未建立,略過上傳。建立後可從本次 artifact 下載 $ZIP_NAME 手動附加。"
          fi
